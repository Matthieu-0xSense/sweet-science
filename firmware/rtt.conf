# Move logging and shell to SEGGER RTT (SWD probe) instead of USB CDC.
#   west build -b <board> firmware -- -DEXTRA_CONF_FILE=rtt.conf
#   pyocd rtt -t nrf52840
# Useful once the node runs on battery with no USB attached.

CONFIG_USE_SEGGER_RTT=y
CONFIG_LOG_BACKEND_RTT=y
CONFIG_LOG_BACKEND_UART=n
CONFIG_SHELL_BACKEND_RTT=y
CONFIG_SHELL_BACKEND_SERIAL=n
