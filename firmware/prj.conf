# Boxe_AI node — Zephyr (upstream, v4.4.x)

CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="BOXE-X"
# Device name is overridden at runtime from a hand-select GPIO or build flag
CONFIG_BT_DEVICE_NAME_DYNAMIC=y
CONFIG_BT_L2CAP_TX_MTU=247
CONFIG_BT_BUF_ACL_TX_SIZE=251
CONFIG_BT_BUF_ACL_RX_SIZE=251

# Raw 1 kHz capture pushes 208 B x 50/s = ~10.4 kB/s on top of the 100 Hz
# stream. The defaults do not carry that: three tx buffers empty faster than
# the controller refills them, and the 1M PHY with a 30-50 ms interval has no
# headroom. Data length extension keeps one notify in one link-layer packet.
CONFIG_BT_BUF_ACL_TX_COUNT=10
CONFIG_BT_CONN_TX_MAX=10
# Raising the tx count forces this one: every tx buffer can produce a
# num-completed-packets event, so the host asserts at build time unless the
# event RX pool is strictly larger than the ACL TX pool.
CONFIG_BT_BUF_EVT_RX_COUNT=12
CONFIG_BT_CTLR_PHY_2M=y
CONFIG_BT_USER_PHY_UPDATE=y
CONFIG_BT_AUTO_PHY_UPDATE=y
CONFIG_BT_CTLR_DATA_LENGTH_MAX=251
CONFIG_BT_AUTO_DATA_LEN_UPDATE=y

CONFIG_I2C=y
CONFIG_ADC=y
CONFIG_GPIO=y

# Console + shell land on the USB CDC port (the uf2 board variant wires
# zephyr,console to board_cdc_acm_uart) — no debug probe needed for bring-up.
# For RTT over the Pi Debug Probe instead, add: -DEXTRA_CONF_FILE=rtt.conf
CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_SHELL=y
CONFIG_I2C_SHELL=y

CONFIG_MAIN_STACK_SIZE=2048
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048

# Float printf for debug
CONFIG_CBPRINTF_FP_SUPPORT=y

# Honour the board's DT code partition (0x26000). Without this Zephyr links at
# 0x0, over the MBR/SoftDevice region the Adafruit UF2 bootloader reserves, and
# the bootloader never jumps to the image.
CONFIG_USE_DT_CODE_PARTITION=y

# sys_reboot(), used by the `dfu` shell command
CONFIG_REBOOT=y
